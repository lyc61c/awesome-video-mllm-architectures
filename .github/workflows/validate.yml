name: Validate collection
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_repository.py
      - run: python scripts/build_readme.py --check
      - run: python scripts/build_editorial_diagrams.py --check
