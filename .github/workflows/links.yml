name: Audit external links
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_external_links.py --output link-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: link-audit
          path: link-audit.json
